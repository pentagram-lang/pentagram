[project]
name = "pentagram-tools"
version = "0.1.0"
requires-python = "==3.13.*"

[tool.ruff]
line-length = 75
indent-width = 2
target-version = "py313"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ANN"]

[tool.ty.environment]
python-version = "3.13"
root = ["."]

[tool.ty.src]
include = ["zero", "proj"]

[tool.pytest.ini_options]
testpaths = ["zero", "proj"]
python_files = ["*_test.py"]
python_classes = []
addopts = ["--durations=0", "--durations-min=0"]
